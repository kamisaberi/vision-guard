node:
  identifier: "Edge-Vision-Conveyor-02"
  site_identifier: "Edge-Vision-Conveyor-02"
  hardware: { type: "DEVICE_VIRTUAL_TPM", primary_backend: "NVIDIA_TENSORRT", xdp_driver_mode: "SKB" }
nexus: { enabled: true, host: "10.240.80.10", port: 50051, nexus_http_port: 9443, active_model_name: "lidar_spatial_detector.onnx", local_models_dir: "/etc/sentinel/models" }
routes:
  - sensor_id: Conveyor-GigE-Sorter-02
    sensor_type: GIGE_VISION_GVCP
    driver_mode: AF_XDP_UMEM
    match:
      port: 3956
      transport: udp
      package_id: org.aryorithm.package.gige_sorter_guard
      plugin_id: vision_guard_dissector_plugin.so
      owner_subsystem: 17_iot_sec
      execution_mode: CASCADE_SHORT_CIRCUIT
      model_id: lidar_spatial_detector.onnx
      silicon_target: NVIDIA_TENSORRT
      format: ONNX
      precision: INT8
      latency_budget_ns: 12000
      threshold_drop: 0.85

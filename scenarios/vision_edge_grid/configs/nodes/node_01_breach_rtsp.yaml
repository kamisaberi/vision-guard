node:
  identifier: "Edge-Vision-Breach-01"
  site_identifier: "Edge-Vision-Breach-01"
  hardware: { type: "DEVICE_VIRTUAL_TPM", primary_backend: "INTEL_OPENVINO", xdp_driver_mode: "SKB" }
nexus: { enabled: true, host: "10.240.80.10", port: 50051, nexus_http_port: 9443, active_model_name: "network_threat_int8.onnx", local_models_dir: "/etc/sentinel/models" }
routes:
  - sensor_id: Gate-RTSP-Camera-01
    sensor_type: RTSP_4K_VISION
    driver_mode: AF_XDP_UMEM
    match:
      port: 8554
      transport: tcp
      package_id: org.aryorithm.package.rtsp_breach_guard
      plugin_id: vision_guard_dissector_plugin.so
      owner_subsystem: 03_ndr
      execution_mode: CASCADE_SHORT_CIRCUIT
      model_id: network_threat_int8.onnx
      silicon_target: INTEL_OPENVINO
      format: ONNX
      precision: INT8
      latency_budget_ns: 15000
      threshold_drop: 0.85
